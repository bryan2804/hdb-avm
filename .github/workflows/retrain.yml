name: Monthly Retrain

on:
  schedule:
    - cron: "0 2 1 * *"  # 2am UTC on the 1st of every month
  workflow_dispatch:       # also allows manual trigger from GitHub UI

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[train]"

      - name: Fetch latest HDB data
        run: python3 src/fetch_data.py

      - name: Rebuild features
        run: python3 -m hdb_avm.features.pipeline

      - name: Retrain model and compute metrics
        run: python3 -m hdb_avm.training.train

      - name: Rebuild SQL analytics artifact
        run: python3 -m hdb_avm.training.build_duckdb

      - name: Run test suite against new artifacts
        run: |
          pip install -e ".[api,dev]"
          python3 -m pytest tests/

      - name: Commit updated models and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/xgboost.joblib models/linear_regression.joblib
          git add models/feature_columns.json models/metrics.json models/town_centroids.json
          git add models/hdb_avm.duckdb
          git add data/resale-flat-prices.csv data/processed_v2.csv
          git diff --staged --quiet || git commit -m "chore: monthly retrain $(date +'%Y-%m')"
          git push
