[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hdb-avm"
version = "1.0.0"
description = "HDB resale Automated Valuation Model: shared ML core, FastAPI service, and training pipeline"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "duckdb>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]
train = [
    "requests>=2.31",
    "shap>=0.45",  # exploratory analysis only; serving uses XGBoost pred_contribs
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["hdb_avm"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "notebooks", "src", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
